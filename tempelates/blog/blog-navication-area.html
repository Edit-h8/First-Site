{% load static %}
    <div class="navigation-area">
          <div class="row">
            {% if previous_post %}
                <div
                class="col-lg-6 col-md-6 col-12 nav-left flex-row d-flex justify-content-start align-items-center"
                >
                <div class="thumb">
                    <a href="{% url 'blog:single' pid=previous_post.id %}"
                    >
                    <img
                    class="img-fluid"
                    style= 
                    "
                    width:200px;
                    height:100px;
                    margin-right:-50px;
                    overflow:hidden;
                    "
                    src="{{previous_post.image.url}}"
                    alt=""
                    /></a>
                </div>
                <div class="arrow">
                    <a href="#"
                    ><span class="lnr text-white lnr-arrow-left"></span
                        ></a>
                    </div>
                    <div class="detials">
                        <p>Prev Post</p>
                        <a href="{% url 'blog:single' pid=previous_post.id %}"><h4>{{previous_post.titel}}</h4></a>
                    </div>
                </div>
                {% else %}
                <div
                class="col-lg-6 col-md-6 col-12 nav-left flex-row d-flex justify-content-start align-items-center"
                >
                <div class="thumb">
                    <a href="#"
                    ><img
                    class="img-fluid"
                    src="{% static 'img/blog/prev.jpg' %}"
                    
                    alt=""
                    /></a>
                </div>
            <div class="detials">
                <p>Previous Post</p>
                <a href="#"><h4>no have !!</h4></a>
            </div>
            <div class="arrow">
                <a href="#"
                ><span class="lnr text-white lnr-arrow-right"></span
                    ></a>
                </div>
                
            </div>
            {% endif %}

            <div
            class="col-lg-6 col-md-6 col-12 nav-right flex-row d-flex justify-content-end align-items-center"
            >
            {% if next_post %}
            <div class="detials">
                <p>Next Post</p>
                <a href="{% url 'blog:single' pid=next_post.id %}"><h4>{{next_post.titel}}</h4></a>
            </div>
            <div class="arrow">
                <a href="#"
                ><span class="lnr text-white lnr-arrow-right"></span
                    ></a>
                </div>
                <div class="thumb">
                    <a href="{% url 'blog:single' pid=next_post.id %}"
                    ><img
                    class="img-fluid"
                    src="{{next_post.image.url}}"
                    style= 
                    "
                    width:200px;
                    height:100px;
                    margin-left:-50px;
                    overflow:hidden;
                    "
                    alt=""
                    /></a>
                </div>
            </div>
            {% else %}
           
            <div class="detials">
                <p>Next Post</p>
                <a href="#"><h4>No Have</h4></a>
            </div>
            <div class="arrow">
                <a href="#"
                ><span class="lnr text-white lnr-arrow-right"></span
                    ></a>
                </div>
                <div class="thumb">
                    <a href="#"
                    ><img
                    class="img-fluid"
                    src="{% static 'img/blog/next.jpg' %}"
                    alt=""
                    /></a>
                </div>
            </div>
            {% endif %}
          </div>
        </div>
